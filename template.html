<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>/*TITLE*/</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" data-aw-favicon href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23293e32%22/%3E%3Cpath d=%22M32 9l5.4 11.6 12.6 1.6-9.3 8.7 2.4 12.5L32 37.2 20.9 43.4l2.4-12.5L14 22.2l12.6-1.6z%22 fill=%22%23f2c14e%22/%3E%3Ctext x=%2232%22 y=%2258%22 font-family=%22ui-rounded,system-ui,sans-serif%22 font-size=%2217%22 font-weight=%22800%22 text-anchor=%22middle%22 fill=%22%23fffaf0%22%3EAW%3C/text%3E%3C/svg%3E">
<style>
html { background: #06121c; }
body { position: fixed; inset: 0; margin: 0; overflow: hidden; background: #06121c; color: #eef7fb; font: 600 15px/1.45 system-ui, -apple-system, sans-serif; }
canvas { position: absolute; width: 100%; height: 100%; display: block; transition: filter .8s, opacity 1s; }
body.l canvas { opacity: 0; }
body.m canvas { filter: blur(6px) brightness(.55); }
.stamp { position: fixed; top: 14px; right: 14px; z-index: 5; border: 3px solid #f2c86b; color: #f2c86b; padding: 3px 10px; font: 700 13px ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; transform: rotate(-4deg); background: rgba(6,18,28,.85); border-radius: 4px; }
#menu { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; }
body.m #menu, body.l #menu { display: grid; }
#menu h1 { font-size: clamp(28px, 6vw, 54px); margin: 0 0 6px; letter-spacing: .02em; }
#menu p { margin: 6px auto; max-width: 560px; color: #c9dde6; }
#go { margin: 14px 0 8px; padding: 12px 26px; font: 700 17px system-ui; border: 0; border-radius: 12px; background: #7fe0d0; color: #04222b; cursor: pointer; }
body.l #go { display: none; }
#s { color: #9fc3d1; }
body:not(.l) #s { display: none; }
.keys { font: 500 13px ui-monospace, Menlo, monospace; color: #b8ccd6; }
#menu a { color: #7fe0d0; }
#i { position: fixed; left: 10px; bottom: 10px; font: 12px ui-monospace, Menlo, monospace; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
body.e #s { color: #ffb3a7; display: block; }
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div class=stamp>Exploration</div>
<div id=menu><div>
  <h1>/*TITLE*/</h1>
  <p>/*BLURB*/</p>
  <p id=s>Starting…</p>
  <button id=go>Fly in</button>
  <p class=keys>Mouse to look · WASD to fly · E/Q up/down · Shift faster · 1–3 viewpoints (1 is the concept's camera) · H stats · Esc menu</p>
  <p><a href="index.html">Back to the study</a> · <a href="/*OTHER*/">/*OTHERNAME*/</a></p>
</div></div>
<div id=i hidden></div>
<script>/*SCRIPT*/</script>
</body>
</html>
